# Example pour le tracking par overlap
PATHS:
  FILES_PATTERN: /home/onyxia/work/DATA/DETECT_GLO12//Anticyclonic*.nc
  SAVE_DIR: /home/onyxia/work/DATA/TRACKING_GLO12/
# Number of timestep for missing detection
VIRTUAL_LENGTH_MAX: 1
# Minimal time to consider as a full track
TRACK_DURATION_MIN: 10

CLASS:
    MODULE: py_eddy_tracker.featured_tracking.area_tracker
    CLASS: AreaTracker
    OPTIONS:
        cmin: .02
# cmin = minimal overlap ratio to associate eddies together (2%).
