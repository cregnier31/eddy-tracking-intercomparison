build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eddy_project"
version = "0.1.0"
description = "Package to perform regional & global eddy detection and model/obs eddy matching"
authors = [ 
    { name = "Sylvain Cailleau", email = "scailleau@mercator-ocean.fr" } 
]
readme = "README.md"
dependencies = [
    { python = "3.10" }
    { numpy ="1.26.4" }
    { matplotlib = "3.5.2" }
    #{ pyeddytracker = {git = "https://github.com/svangennip/py-eddy-tracker.git"} }
]

[tool.hatch.metadata]
name = "eddy_project"
version = "0.1.0"
description = "Package to perform regional & global eddy detection and model/obs eddy matching"
authors = ["Sylvain Cailleau <scailleau@mercator-ocean.fr>"]

[tool.hatch.version]
# Define versioning scheme
version = "0.1.0"

[tool.hatch.vcs]
# VCS settings for versioning, e.g., Git integration
enabled = true

[project.scripts]
eddy_load = "eddy_load.__main__:main"

[tool.hatch.scripts]
eddy_load = "eddy_load.__main__:main"

