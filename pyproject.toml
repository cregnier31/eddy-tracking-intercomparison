# ====================
# File: pyproject.toml
# ====================
# --------------------------
# Build system configuration
# --------------------------
[build-system]
requires = ["hatchling",  "hatch-regex-commit"]
build-backend = "hatchling.build"
#
# ------------------------------
# Project descript & metadataion
# ------------------------------
[project]
name = "eddy_project"
dynamic = ["version"]
description = "Package to perform regional and global eddy detection and model/obs eddy matching"
authors = [ { name = "Sylvain Cailleau", email = "scailleau@mercator-ocean.fr" } ]
readme = "README.md"
dependencies = [
    "numpy<2,>=1.20",
    "matplotlib<3.7",
    "py-eddy-tracker",
    "pyregrid==1.2.27" ]

# The Python version required by the project
#

# ----------------------------------------
# Main scripts of the project to be launch
# ----------------------------------------
[project.scripts]
eddy_load = "eddy_load.__main__:main"
eddy_detect = "eddy_detect.__main__:main"
eddy_track = "eddy_track.__main__:main"
eddy_diags = "eddy_diags.__main__:main"
eddy_run = "eddy_run.__main__:main"
#

# ------------
# Project URLs
# ------------
[project.urls]
homepage = "https://gitlab.mercator-ocean.fr/internal-shared-group/validation/eddy-tracking-intercomparison.git"
documentation  ="https://gitlab.mercator-ocean.fr/internal-shared-group/validation/eddy-tracking-intercomparison.git"
repository = "https://gitlab.mercator-ocean.fr/internal-shared-group/validation/eddy-tracking-intercomparison.git"
#

# -------------------------------------
# Hatch build configuration & metadata
# ------------------------------------
#
#   - versionning
[tool.hatch.version]
source = "regex_commit"
path = "eddy_run/version.py"
check_dirty = false
commit = true
commit_message = "[ci skip] Version bump committed by Jenkins"
tag = true
tag_message = "Tagged for deployment by Jenkins"
tag_sign = false

#
#   - VCS settings for versioning (e.g., Git integration)
[tool.hatch.vcs]
enabled = true
#
#    - main scrip
[tool.hatch.build.targets.wheel]
packages = ["eddy_load", "eddy_detect", "eddy_track", "eddy_diags", "eddy_run"]

[tool.hatch.script]
eddy_load = "eddy_load.__main__:main"
eddy_detect = "eddy_detect.__main__:main"
eddy_track = "eddy_track.__main__:main"
eddy_diags = "eddy_diags.__main__:main"
eddy_run = "eddy_run.__main__:main"
#
# ================================================
