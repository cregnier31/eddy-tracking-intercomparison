# ====================
# File: pyproject.toml
# ====================
# --------------------------
# Build system configuration
# --------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
#
# ------------------------------
# Project descript & metadataion
# ------------------------------
[project]
name = "eddy_project"
version = "0.1.0"
description = "Package to perform regional and global eddy detection and model/obs eddy matching"
authors = [ { name = "Sylvain Cailleau", email = "scailleau@mercator-ocean.fr" } ]
readme = "README.md"
dependencies = [
    "numpy",
    "matplotlib" ]
# The Python version required by the project
requires-python = "==3.10.0"
#
# ----------------------------------------
# Main scripts of the project to be launch
# ----------------------------------------
[project.scripts]
eddy_load = "eddy_load.__main__:main"
eddy_detect = "eddy_detect.__main__:main"
eddy_track = "eddy_track.__main__:main"
eddy_diags = "eddy_diags.__main__:main"
eddy_run = "eddy_run.__main__:main"
#
# ------------
# Project URLs
# ------------
[project.urls]
homepage = "https://gitlab.mercator-ocean.fr/fdubost/eddy-tracking-intercomparison.git"
documentation  =" https://gitlab.mercator-ocean.fr/fdubost/eddy-tracking-intercomparison.git"
repository = "https://gitlab.mercator-ocean.fr/fdubost/eddy-tracking-intercomparison.git"
#
# -------------------------------------
# Hatch build configuration & metadata
# ------------------------------------
#
#   - metadata---
[tool.hatch.metadata]
name = "eddy_project"
version = "0.1.0"
description = "Package to perform regional & global eddy detection and model/obs eddy matching"
authors = [ { name = "Sylvain Cailleau", email = "scailleau@mercator-ocean.fr" } ]
#   - versionning
[tool.hatch.version]
# Define versioning scheme
version = "0.1.0"
#
#   - VCS settings for versioning (e.g., Git integration)
[tool.hatch.vcs]
enabled = true
#
#    - main scrip
[tool.hatch.build.targets.wheel]
packages = ["eddy_load", "eddy_detect", "eddy_track", "eddy_diags", "eddy_run"]

[tool.hatch.script]
eddy_load = "eddy_load.__main__:main"
eddy_detect = "eddy_detect.__main__:main"
eddy_track = "eddy_track.__main__:main"
eddy_diags = "eddy_diags.__main__:main"
eddy_run = "eddy_run.__main__:main"
#
# ================================================
